[project]
name = "memory-platform"
version = "0.1.0"
description = "Agent Memory Platform: API, domain rules and database access."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "pgvector",
    "pypdf",
    "python-docx",
    "mcp",
    "cryptography",
]

[project.scripts]
memory-admin = "memory_platform.admin:main"
memory = "memory_platform.cli:main"
memory-mcp = "memory_platform.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_platform"]
